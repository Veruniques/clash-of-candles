<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E7C8A"/><stop offset=".45" stop-color="#2B4652"/><stop offset="1" stop-color="#16303B"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9D3DC"/><stop offset=".5" stop-color="#6E8D99"/><stop offset="1" stop-color="#C9E1E8"/></linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7EF0F8"/><stop offset="1" stop-color="#0B5E6E"/></linearGradient>
    <radialGradient id="lens" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#5D7FB0"/><stop offset=".35" stop-color="#0E1B2A"/><stop offset="1" stop-color="#03070C"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <g filter="url(#sh)">
    <!-- front phone (behind) -->
    <g transform="rotate(-12 95 120)">
      <rect x="52" y="34" width="86" height="172" rx="20" fill="url(#rim)"/>
      <rect x="56" y="38" width="78" height="164" rx="17" fill="#04121A"/>
      <rect x="60" y="42" width="70" height="156" rx="14" fill="url(#scr)"/>
      <rect x="81" y="48" width="28" height="8" rx="4" fill="#04121A"/>
      <g transform="translate(77 92)">
        <rect x="6" y="0" width="3" height="54" rx="1.5" fill="#0C9A60"/><rect x="0" y="12" width="15" height="30" rx="3" fill="#2EE29A"/>
        <rect x="27" y="6" width="3" height="50" rx="1.5" fill="#C9183A"/><rect x="21" y="16" width="15" height="26" rx="3" fill="#FF4767"/>
      </g>
      <rect x="60" y="42" width="70" height="156" rx="14" fill="url(#gloss)"/>
    </g>
    <!-- back phone (front) -->
    <g transform="rotate(8 150 124)">
      <rect x="106" y="40" width="88" height="174" rx="21" fill="url(#rim)"/>
      <rect x="110" y="44" width="80" height="166" rx="18" fill="url(#body)"/>
      <rect x="116" y="50" width="44" height="44" rx="12" fill="#1C3540" stroke="#7E9CA7" stroke-opacity=".5"/>
      <circle cx="128" cy="62" r="8" fill="url(#lens)" stroke="#9FB9C2" stroke-width="1.5"/>
      <circle cx="148" cy="62" r="8" fill="url(#lens)" stroke="#9FB9C2" stroke-width="1.5"/>
      <circle cx="128" cy="82" r="8" fill="url(#lens)" stroke="#9FB9C2" stroke-width="1.5"/>
      <circle cx="148" cy="82" r="3" fill="#FFF3C7"/>
      <rect x="110" y="44" width="80" height="166" rx="18" fill="url(#gloss)"/>
    </g>
  </g>
</svg>
